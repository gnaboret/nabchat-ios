name: Upload iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: "1"

jobs:
  upload-testflight:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build physical-device framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          mkdir -p shared/build/bin/iosSimulatorArm64/debugFramework
          rm -rf shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
          cp -R shared/build/bin/iosArm64/releaseFramework/NabchatShared.framework shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Install signing identity and profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/nabchat.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nabchat.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/nabchat.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nabchat.keychain-db"
          security import "$RUNNER_TEMP/nabchat.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/nabchat.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/nabchat.keychain-db" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nabchat.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/nabchat.mobileprovision"
      - name: Archive nabchat
        working-directory: iosApp
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: >-
          xcodebuild archive
          -project NabchatIOS.xcodeproj
          -scheme NabchatIOS
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/nabchat.xcarchive"
          CURRENT_PROJECT_VERSION="${{ inputs.build_number }}"
          DEVELOPMENT_TEAM="$TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Verify packaged release metadata
        env:
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          APP_PLIST="$RUNNER_TEMP/nabchat.xcarchive/Products/Applications/nabchat.app/Info.plist"
          PRIVACY_MANIFEST="$RUNNER_TEMP/nabchat.xcarchive/Products/Applications/nabchat.app/PrivacyInfo.xcprivacy"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          TRACKING="$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' "$PRIVACY_MANIFEST")"
          TRACKING_DOMAIN="$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTrackingDomains:0' "$PRIVACY_MANIFEST")"
          echo "Packaged app version: $ACTUAL_VERSION ($ACTUAL_BUILD)"
          echo "Packaged privacy tracking declaration: $TRACKING"
          echo "First packaged tracking domain: $TRACKING_DOMAIN"
          test "$ACTUAL_VERSION" = "1.0"
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD"
          test "$TRACKING" = "true"
          test -n "$TRACKING_DOMAIN"
      - name: Prepare App Store Connect key and export options
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>com.nabchat.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/nabchat.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"
