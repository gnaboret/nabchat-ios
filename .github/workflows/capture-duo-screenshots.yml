name: Capture iPhone Duo App Store screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Build simulator app
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild build \
            -project NabchatIOS.xcodeproj \
            -scheme NabchatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone Duo" \
            -derivedDataPath "$RUNNER_TEMP/DuoDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture native Duo screenshots
        run: |
          DEVICE="iPhone Duo"
          APP="$RUNNER_TEMP/DuoDerivedData/Build/Products/Debug-iphonesimulator/nabchat.app"
          mkdir -p AppStoreScreenshots/iPhone-Duo
          xcrun simctl boot "$DEVICE" || true
          sleep 30
          xcrun simctl install "$DEVICE" "$APP"
          for MODE in river rooms rug settings; do
            xcrun simctl terminate "$DEVICE" com.nabchat.app || true
            SIMCTL_CHILD_NABCHAT_SCREENSHOT_MODE="$MODE" xcrun simctl launch "$DEVICE" com.nabchat.app
            sleep 18
            xcrun simctl io "$DEVICE" screenshot "AppStoreScreenshots/iPhone-Duo/nabchat-duo-$MODE.png"
          done
      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: nabchat-iphone-duo-screenshots
          path: AppStoreScreenshots/iPhone-Duo/*.png
