name: Shared iOS framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-framework:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build iOS simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS app for simulator
        working-directory: iosApp
        run: >-
          xcodebuild
          -project NabchatIOS.xcodeproj
          -scheme NabchatIOS
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/simulator
          -configuration Debug
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build physical-device framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64
      - name: Select physical-device framework
        run: |
          rm -rf shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
          cp -R shared/build/bin/iosArm64/releaseFramework/NabchatShared.framework shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
      - name: Compile iOS app for physical devices
        working-directory: iosApp
        run: >-
          xcodebuild
          -project NabchatIOS.xcodeproj
          -scheme NabchatIOS
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath build/device
          -configuration Release
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Symbolicate ads startup crash offsets
        working-directory: iosApp
        run: |
          DWARF="build/device/Build/Products/Release-iphoneos/nabchat.app.dSYM/Contents/Resources/DWARF/nabchat"
          if [ -f "$DWARF" ]; then
            echo "Build 20 exception and file-attribute frames:"
            xcrun atos -arch arm64 -o "$DWARF" -l 0x100000000 \
              0x10025550c 0x100255688 0x1002718dc 0x1002715cc 0x1002714a8 0x100255eec
          else
            echo "dSYM not found at $DWARF"
            find build/device -name '*.dSYM' -print
          fi
      - name: Upload unsigned simulator build
        uses: actions/upload-artifact@v4
        with:
          name: nabchat-ios-simulator
          path: iosApp/build/simulator/Build/Products/Debug-iphonesimulator/nabchat.app
