name: NabchatIOS

options:
  bundleIdPrefix: com.nabchat
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  NabchatIOS:
    type: application
    platform: iOS
    sources:
      - path: NabchatIOS
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabchat.app
        PRODUCT_NAME: nabchat
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: nabchat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

schemes:
  NabchatIOS:
    build:
      targets:
        NabchatIOS: all
    run:
      config: Debug
