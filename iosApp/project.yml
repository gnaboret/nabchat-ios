name: NabchatIOS

options:
  bundleIdPrefix: com.nabchat
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.5.0

targets:
  NabchatIOS:
    type: application
    platform: iOS
    info:
      path: NabchatIOS/Info.plist
      properties:
        CFBundleDisplayName: nabchat
        GADApplicationIdentifier: ca-app-pub-5870784629837288~9565748760
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "This helps keep nabchat free by measuring ad performance and showing relevant ads."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: NabchatIOS
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/NabchatShared.framework
        embed: false
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabchat.app
        PRODUCT_NAME: nabchat
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 24
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

schemes:
  NabchatIOS:
    build:
      targets:
        NabchatIOS: all
    run:
      config: Debug
